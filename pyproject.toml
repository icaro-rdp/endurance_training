[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endurance-training-kb"
version = "0.1.0"
description = "Private, evidence-grounded endurance training knowledge base"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
books = ["markitdown>=0.1"]
scraping = [
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "ruff>=0.12,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
endurance-kb = "main.cli:main"
endurance-kb-mcp = "main.mcp_server:main"

[tool.setuptools.packages.find]
include = ["main*"]
namespaces = false

[tool.mypy]
python_version = "3.10"
files = ["main/utils/kb_engine", "main/cli.py", "main/mcp_server.py"]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
