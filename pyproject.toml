[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endurance-training-kb"
version = "0.1.0"
description = "Private, evidence-grounded endurance training knowledge base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-translation-text>=2.0.0",
    "deepl>=1.32.0",
    "fastembed>=0.8.0",
    "mcp>=2.0.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0,<7",
    "spotifyscraper>=3.9.2",
    "sqlite-vec>=0.1.9",
    "tqdm>=4.70.0",
]

[project.optional-dependencies]
local-ai = [
    "mlx-lm>=0.21.0",
    "outlines[mlxlm]>=1.3,<2",
]
scraping = [
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "types-PyYAML>=6.0,<7",
    "types-tqdm>=4.70.0.20260827",
]

[project.scripts]
endurance-kb = "main.cli:main"
endurance-kb-mcp = "main.mcp_server:main"
spotify-transcript-scraper = "main.spotify_transcript_scraper:main"
spotify-scraper = "main.spotify_transcript_scraper:main"

[tool.setuptools.packages.find]
include = ["main*"]
namespaces = false

[tool.mypy]
python_version = "3.12"
files = ["main/utils/kb_engine", "main/cli.py", "main/mcp_server.py"]
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
